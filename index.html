<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Horizontal Subtraction Practice</title>
    <style>
        /* Basic Reset */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* Container Styling */
        .quiz-container {
            max-width: 500px;
            width: 90%;
            margin: 2rem auto;
            padding: 2rem;
            background-color: #ffffff;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            text-align: center;
        }

        h2 {
            color: #333;
            margin-bottom: 1.5rem;
            font-size: 1.5rem;
        }

        /* The Math Equation Display */
        .equation-display {
            font-size: 1.8rem;
            font-weight: bold;
            color: #2c3e50;
            margin-bottom: 1.5rem;
            letter-spacing: 2px;
            word-wrap: break-word;
        }

        /* Input Field */
        .input-group {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

        input[type="number"] {
            padding: 0.8rem;
            font-size: 1.2rem;
            border: 2px solid #ccc;
            border-radius: 8px;
            text-align: center;
            width: 100%;
            /* Prevents auto-zoom on mobile */
            font-size: 16px; 
        }

        input[type="number"]:focus {
            border-color: #9b59b6; /* Changed to purple to distinguish from addition */
            outline: none;
        }

        /* Buttons */
        .btn {
            padding: 0.8rem 1.5rem;
            font-size: 1.1rem;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: background-color 0.2s ease;
            width: 100%;
        }

        .btn-submit {
            background-color: #9b59b6; /* Purple theme for subtraction */
            color: white;
        }

        .btn-submit:hover {
            background-color: #8e44ad;
        }

        .btn-next {
            background-color: #95a5a6;
            color: white;
            display: none; /* Hidden until an answer is submitted */
        }

        .btn-next:hover {
            background-color: #7f8c8d;
        }

        /* Feedback Message */
        .feedback {
            font-size: 1.2rem;
            font-weight: bold;
            min-height: 1.5rem;
            margin-bottom: 1rem;
        }

        .correct { color: #27ae60; }
        .incorrect { color: #e74c3c; }

        /* Mobile Adjustments */
        @media (min-width: 480px) {
            .input-group {
                flex-direction: row;
                justify-content: center;
            }
            .btn {
                width: auto;
            }
        }

        /* Prevent text selection across the page */
        body {
            user-select: none;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
        }
    </style>
</head>
<body>

    <div class="quiz-container">
        <h2>Practice Subtraction</h2>
        
        <div class="feedback" id="feedback"></div>
        <div class="equation-display" id="equation"></div>
        
        <div class="input-group">
            <input type="number" id="answer-input" placeholder="Your answer" autocomplete="off">
            <button class="btn btn-submit" id="submit-btn" onclick="checkAnswer()">Submit</button>
        </div>
        
        <button class="btn btn-next" id="next-btn" onclick="generateProblem()">Try Another Problem</button>
        <h4>by RAJAMOULI.BOMMERA,S.A(MATHS)</h4>
    </div>

    <script>
        // Disable right-click menu
        document.addEventListener('contextmenu', event => event.preventDefault());

        // Disable F12, Ctrl+U, and Developer Tools shortcuts
        document.addEventListener('keydown', function(e) {
            // F12
            if (e.key === 'F12' || e.keyCode === 123) {
                e.preventDefault();
                return false;
            }
            // Ctrl + U (View Source)
            if (e.ctrlKey && (e.key === 'u' || e.key === 'U' || e.keyCode === 85)) {
                e.preventDefault();
                return false;
            }
            // Ctrl + Shift + I (Dev Tools)
            if (e.ctrlKey && e.shiftKey && (e.key === 'i' || e.key === 'I' || e.keyCode === 73)) {
                e.preventDefault();
                return false;
            }
            // Ctrl + Shift + J (Console)
            if (e.ctrlKey && e.shiftKey && (e.key === 'j' || e.key === 'J' || e.keyCode === 74)) {
                e.preventDefault();
                return false;
            }
            // Ctrl + Shift + C (Element Inspector)
            if (e.ctrlKey && e.shiftKey && (e.key === 'c' || e.key === 'C' || e.keyCode === 67)) {
                e.preventDefault();
                return false;
            }
        });

        let currentAnswer = 0;

        // Function to speak text using the Web Speech API
        function speak(text) {
            if ('speechSynthesis' in window) {
                // Cancel any ongoing speech so sentences don't overlap
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                window.speechSynthesis.speak(utterance);
            }
        }

        // Function to generate a random number between a min and max
        function getRandomInt(min, max) {
            return Math.floor(Math.random() * (max - min + 1)) + min;
        }

        // Function to get a random number of a specific length (1 to 4 digits)
        function getRandomNumberByDigits() {
            const digitCount = getRandomInt(1, 4);
            if (digitCount === 1) return getRandomInt(1, 9);
            if (digitCount === 2) return getRandomInt(10, 99);
            if (digitCount === 3) return getRandomInt(100, 999);
            return getRandomInt(1000, 9999);
        }

        function generateProblem() {
            // Generate the first number (the minuend)
            // We make sure it's at least a 2-digit number so there's room to subtract
            let num1 = getRandomNumberByDigits();
            if (num1 < 10) num1 = getRandomInt(10, 9999); 
            
            // Generate the second number (the subtrahend)
            // It must be smaller than or equal to num1 to avoid negative answers
            let num2 = getRandomNumberByDigits();
            while (num2 > num1) {
                num2 = getRandomNumberByDigits();
            }

            // Calculate the correct answer
            currentAnswer = num1 - num2;

            // Build the equation string
            const equationString = num1 + " - " + num2 + " = ?";
            
            // Update the UI
            document.getElementById('equation').innerText = equationString;
            document.getElementById('answer-input').value = "";
            document.getElementById('feedback').innerText = "";
            document.getElementById('feedback').className = "feedback";
            
            // Reset buttons
            document.getElementById('submit-btn').style.display = "inline-block";
            document.getElementById('next-btn').style.display = "none";
            document.getElementById('answer-input').disabled = false;
            document.getElementById('answer-input').focus();
        }

        function checkAnswer() {
            const userAnswer = parseInt(document.getElementById('answer-input').value, 10);
            const feedbackEl = document.getElementById('feedback');

            if (isNaN(userAnswer)) {
                feedbackEl.innerText = "Please enter a number.";
                feedbackEl.className = "feedback incorrect";
                return;
            }

            if (userAnswer === currentAnswer) {
                feedbackEl.innerText = "🎉 Fantastic! That is correct.";
                feedbackEl.className = "feedback correct";
                
                // Play correct audio
                speak("Congratulations, you are correct");

                // Show next button, hide submit, disable input
                document.getElementById('submit-btn').style.display = "none";
                document.getElementById('next-btn').style.display = "inline-block";
                document.getElementById('answer-input').disabled = true;
            } else {
                feedbackEl.innerText = "Not quite. Solve it once again!";
                feedbackEl.className = "feedback incorrect";
                
                // Play incorrect audio
                speak("Not quite. Solve it once again");
            }
        }

        // Allow pressing "Enter" to submit the answer
        document.getElementById('answer-input').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                if (document.getElementById('submit-btn').style.display !== "none") {
                    checkAnswer();
                } else {
                    generateProblem();
                }
            }
        });

        // Initialize the first problem when the page loads
        window.onload = generateProblem;
    </script>

</body>
</html>
